[tools]
go            = "1.26"
golangci-lint = "latest"
staticcheck   = "latest"
gofumpt       = "latest"

# sqlite3 CLI. Not a build dependency — the engine uses the pure-Go
# modernc.org/sqlite driver — but the architecture treats `sqlite3 ecs.db` as a
# first-class debugging tool, so pin it rather than hoping it's on the box.
sqlite = "latest"

# Node exists only for Playwright: the e2e suite in e2e/, scripts/screenshot.js,
# and the Playwright MCP server — all used to verify Forge's UI against the
# design handoff. Forge itself still has no frontend build step; nothing here is
# needed to build or run the binary.
#
# playwright and @playwright/test are pinned to the same version on purpose: the
# runner and the browser bundle ship together, and a drift between them fails in
# ways that read like test bugs.
node                  = "26"
"npm:playwright"      = "1.62.1"
"npm:@playwright/test" = "1.62.1"
"npm:@playwright/mcp" = "latest"

# Deliberately NOT here: templ. It's a go.mod `tool` dependency
# (`go run github.com/a-h/templ/cmd/templ generate`), so its version is locked
# to the module and a clean checkout needs no extra install step.
