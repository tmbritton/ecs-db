# The project the e2e suite points Forge at.
#
# Deliberately NOT the repo's own project. Every value here is distinctive —
# schemaVersion 7 rather than 3, components and entity types prefixed with
# "E2E"/"Test", a mod named "e2e-core" — so that a test asserting on them is
# also asserting that Forge read *this* project. If a path resolution bug made
# it fall back to the repo's real schema.json, the assertions fail loudly
# instead of passing against the wrong data.
#
# Every path is relative to THIS FILE, which is how internal/forge/project
# resolves them, and the fixture is self-contained so the two cannot drift.
# Note that the engine reads the same fields relative to the working directory
# instead — see docs/stories/epic-12/01-editing-session.md. The repo's own
# game.toml sits at the repo root, where both readings coincide, which is why
# the disagreement stayed hidden until a config lived somewhere else.

[database]
path = "./e2e.db"

[schema]
path = "./schema.json"

[[mods]]
name      = "e2e-core"
behaviors = "./behaviors/"
actions   = "./actions/"
guards    = "./guards/"
assets    = "./assets/"

# A second mod, later in load order, declaring a machine e2e-core also declares.
# It is here so the override rule and the "which mod holds this?" create flow
# are exercised by a browser rather than only by Go: both are decisions about
# which file the *game* will run, and both were unreachable from the UI while
# the fixture had a single mod.
#
# It shadows e2e-shadowed and nothing else, deliberately. Overriding a machine
# the Story 2 spec edits by name would move that file's resolved path, and the
# two specs would disagree about which file they meant.
[[mods]]
name      = "e2e-overlay"
behaviors = "./overlay/behaviors/"

[window]
title    = "ECS e2e"
width    = 640
height   = 480
tileSize = 32

# No [map] section: Forge never loads one, and naming a file that does not exist
# would be a trap for the first story that starts resolving it.

[forge]
addr = "127.0.0.1:7788"
